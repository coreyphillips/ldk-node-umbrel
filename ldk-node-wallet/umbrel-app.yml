manifestVersion: 1
id: ldk-node-wallet
name: LDK Node
tagline: Your native Bitcoin and Chicory primary
category: bitcoin
version: "0.1.7"
port: 2114
description: >-
  Manage independent native LDK Node wallets and pair Chicory as your phone wallet.
  View Bitcoin and Lightning balances, channels, payments and peers, and configure
  liquidity, offline settlement and optional Tor and Iroh connections. Each wallet keeps its
  own identity and storage. Mainnet is the initial network selection; choose your
  chain backend before starting a wallet. This experimental release requires the
  compatible Chicory client described in the repository. Funded qualification used
  disposable regtest funds. Read the installation and qualification notes before use.
developer: Corey Phillips
website: https://github.com/coreyphillips/ldk-node-umbrel
repo: https://github.com/coreyphillips/ldk-node-umbrel
support: https://github.com/coreyphillips/ldk-node-umbrel/issues
icon: https://raw.githubusercontent.com/coreyphillips/ldk-node-umbrel/main/ldk-node-wallet/icon.svg
gallery:
  - https://raw.githubusercontent.com/coreyphillips/ldk-node-umbrel/main/docs/screenshots/wallet.png
  - https://raw.githubusercontent.com/coreyphillips/ldk-node-umbrel/main/docs/screenshots/mobile.png
submitter: Corey Phillips
submission: https://github.com/coreyphillips/ldk-node-umbrel
dependencies: []
path: ""
defaultUsername: ""
deterministicPassword: true
storage:
  dataRoot: data
releaseNotes: >-
  Adds Enable Tor connections in wallet settings. The app creates and retains a
  private v3 onion address automatically, so no external onion service is needed.
  Choose Tor in Pair Chicory to scan its QR code while Iroh and local TCP remain
  available. Tor is optional and disabled by default. It accepts incoming client
  connections only; outgoing Lightning peers and chain-backend connections keep
  their existing routing. Full backups retain the onion identity and Tor state.
