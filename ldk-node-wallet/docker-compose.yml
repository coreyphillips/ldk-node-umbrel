version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: ldk-node-wallet_manager_1
      APP_PORT: 3000
  manager:
    image: ghcr.io/coreyphillips/ldk-node-umbrel:0.1.3@sha256:b862859393b4343c16cf040a37ccc339979250d6398bfadda8f0740e50facb72
    restart: on-failure
    init: true
    stop_grace_period: 75s
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports:
      - "19351:9735"
      - "19352:9736"
      - "19353:9737"
      - "19354:9738"
      - "19355:9739"
      - "19356:9740"
      - "19357:9741"
      - "19358:9742"
    environment:
      BIND_ADDRESS: "0.0.0.0"
      AUTH_MODE: password
      DASHBOARD_BOOTSTRAP_PASSWORD: "${APP_PASSWORD}"
      DATA_DIR: /data
      PORT: "3000"
      PUBLIC_PORT_BASE: "19351"
      LIGHTNING_PORT_BASE: "9735"
      ALLOWED_HOSTS: "*"
      # Electrs remains optional. Umbrel normally injects these exports only
      # for declared dependencies; otherwise choose a local preset in the UI.
      DEFAULT_ELECTRUM_HOST: "${APP_ELECTRS_NODE_IP:-}"
      DEFAULT_ELECTRUM_PORT: "${APP_ELECTRS_NODE_PORT:-50001}"
      DEFAULT_ELECTRUM_TLS: "false"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
