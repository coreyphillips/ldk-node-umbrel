name: ldk-node-local
services:
  manager:
    image: ldk-node-umbrel:0.1.4-${LDK_ARCH:-arm64}
    pull_policy: never
    init: true
    restart: unless-stopped
    stop_grace_period: 75s
    security_opt:
      - no-new-privileges:true
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:${DASHBOARD_PORT:-2114}:3000"
      - "19351-19358:9735-9742"
    volumes:
      - ./data:/data
    environment:
      AUTH_MODE: password
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://umbrel.local:2114}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-umbrel.local,localhost,127.0.0.1}"
      PUBLIC_PORT_BASE: "19351"
      LIGHTNING_PORT_BASE: "9735"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
